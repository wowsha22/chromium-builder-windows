name: Build Mini Chromium Installer (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mini-windows:
    runs-on: windows-latest
    env:
      BUILD_ROOT: D:\chromium
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      PATH: D:\chromium\depot_tools;${{ env.PATH }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Create build root
        shell: powershell
        run: |
          Remove-Item -Recurse -Force $env:BUILD_ROOT -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:BUILD_ROOT

      - name: Clone depot_tools
        shell: powershell
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $env:BUILD_ROOT\depot_tools

      - name: Fetch Chromium source (shallow)
        shell: powershell
        run: |
          cd $env:BUILD_ROOT
          fetch --nohooks --no-history chromium

      - name: Sync dependencies (retry up to 3×)
        shell: powershell
        run: |
          cd $env:BUILD_ROOT\src
          for ($i = 1; $i -le 3; $i++) {
            if (gclient sync) { break }
            Write-Host "Retry #$i for gclient sync"
            Start-Sleep -Seconds 15
          }

      - name: Configure Mini build with GN
        shell: powershell
        run: |
          cd $env:BUILD_ROOT\src
          gn gen out\Default --args="is_debug=false is_component_build=false enable_nacl=false"

      - name: Build Mini installer only
        shell: powershell
        run: |
          cd $env:BUILD_ROOT\src
          autoninja -C out\Default mini_installer

      - name: Upload Mini Chromium installer
        uses: actions/upload-artifact@v4
        with:
          name: mini-chromium-installer
          path: $env:BUILD_ROOT\src\out\Default\mini_installer.exe
